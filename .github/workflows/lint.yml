# The checks a KDE reviewer runs before reading any code: licensing, the
# AppStream and desktop metadata, and the formatting. None of them need Qt,
# so they stay fast and independent of the build job.
name: lint

on:
  push:
  pull_request:

jobs:
  reuse:
    name: reuse lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  metadata:
    name: appstream and desktop entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
      # Strict mode is what the Flathub and KDE checks use, so anything it
      # complains about would have come back as a review comment anyway.
      - name: Validate AppStream metadata
        run: appstreamcli validate --strict packaging/*.metainfo.xml
      - name: Validate desktop entry
        run: desktop-file-validate packaging/*.desktop

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    # Reports rather than gates, and the reason is the tree, not the runner.
    #
    # The version is pinned now: clang-format-18 is a real package on the
    # runner's Ubuntu 24.04 (1:18.1.3-1), and 18 is what .kde-ci.yml asks for,
    # so this is the check KDE will run. Plain `clang-format` on the runner is
    # a different build and reports differently, which is what made the old
    # version of this job untrustworthy.
    #
    # Under 18 the tree is not clean: 54 sites across 14 files. Nearly all are
    # block comments written hard against column 0 inside an indented body,
    # which clang-format wants indented to the enclosing block; the remainder
    # is a few lines it would rewrap. None of it is a correctness problem, and
    # reformatting belongs in a commit of its own rather than buried in a CI
    # change - once that lands, this continue-on-error comes off.
    
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror
