version = 1
SPDX-PackageName = "KOutNet"
SPDX-PackageSupplier = "bitzuka <bitzuka.koutnet@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/bitzuka/koutnet"

# Translation catalogs are JSON and have nowhere to put a comment.
[[annotations]]
path = "i18n/**.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 bitzuka <bitzuka.koutnet@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# Binary assets and plain text that carries no header of its own.
[[annotations]]
path = ["NEWCORE-2-CPP/assets/**", "ABOUT/**", "README.md", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 bitzuka <bitzuka.koutnet@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"

# Translation catalogs. The template is generated from the sources by
# Messages.sh, the rest were carried over from the JSON dictionaries.
[[annotations]]
path = ["po/**.po", "po/**.pot"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 bitzuka <bitzuka.koutnet@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-only OR LicenseRef-KDE-Accepted-GPL"
